name: PR Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Execute unit tests
      run: dotnet test Siren.Test/Siren.Test.csproj
      env:
        Configuration: Release 

  # Packages Siren unsigned on every platform and fails the PR unless each build reports a
  # passing Hermes smoke verdict. Unit tests already run in the job above.
  smoke-test:
    permissions:
      contents: read
      packages: read
    uses: mythetech/workflows/.github/workflows/desktop-smoke-test.yml@main
    with:
      app_name: "Siren"
      project_path: "Siren/Siren.csproj"
      global_json_file: "global.json"
      icon_windows: "Siren/wwwroot/logo.ico"
      icon_linux: "Siren/wwwroot/logo5.png"
      icon_macos: "Siren/wwwroot/logo.icns"
      enable_tests: false
      require_verdict: true
