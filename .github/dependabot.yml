version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/Siren"
      - "/Siren.Components"
      - "/Siren.Test"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "Mythetech.*"
    groups:
      mythetech:
        patterns:
          - "Mythetech.*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
